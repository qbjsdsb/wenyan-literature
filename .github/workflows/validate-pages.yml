name: deploy-wenyan-validation
# A deliberate label on our own Draft triggers one validation deployment.
# Ordinary pushes/synchronize events never publish, and forks cannot deploy.
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: wenyan-pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event.label.name == 'cloud-validation-preview' &&
      github.event.pull_request.number == 14 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/cloud-foundation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify hosted denial and public Auth configuration
        run: node tests/cloud-hosted-denial.mjs
      - name: Build public validation configuration
        run: |
          cp .env.example .env.production.local
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: wenyan-validation
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

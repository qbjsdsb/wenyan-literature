name: apply english session integrity v1

on:
  push:
    branches:
      - feature/english-session-integrity-v1
    paths:
      - scripts/apply-english-session-integrity-v1.mjs
      - src/english/session.js
      - src/english/catalog.js
      - tests/english-session.test.mjs
      - tests/english-catalog.test.mjs
      - .github/workflows/apply-english-session-integrity-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply patch
        run: node scripts/apply-english-session-integrity-v1.mjs
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified session integrity fixes
        shell: bash
        run: |
          rm scripts/apply-english-session-integrity-v1.mjs .github/workflows/apply-english-session-integrity-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/english-vocab.js src/english/catalog.js src/english/session.js tests/english-catalog.test.mjs tests/english-session.test.mjs scripts/apply-english-session-integrity-v1.mjs .github/workflows/apply-english-session-integrity-v1.yml
          git commit -m "fix(english): preserve unfinished sessions across refresh and layer changes"
          git push origin HEAD:${GITHUB_REF_NAME}

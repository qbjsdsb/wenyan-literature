<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Wenyan 设备检查夹具</title><style>body{margin:20px;font-family:sans-serif}iframe{display:block;border:1px solid #ccc;max-width:none}button{padding:12px;margin:4px}</style><p>这是浏览器视口检查，不是真机键盘测试。测试状态独立于日常记录。</p><div id="sizes"></div><iframe id="preview" title="Wenyan 设备预览" width="360" height="844" src="/?test=baseline#today"></iframe><script>for(const width of [360,393,412,768,1366,1440]){const b=document.createElement('button');b.textContent=width+'px';b.onclick=()=>document.querySelector('iframe').width=width;document.querySelector('#sizes').append(b)}const b=document.createElement('button');b.textContent='短视口 430px';b.onclick=()=>document.querySelector('iframe').height=430;document.querySelector('#sizes').append(b)</script></html>
